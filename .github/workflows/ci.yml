name: Check PI TTS Pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n install.sh deploy.sh docker-test.sh && sh -n docker/entrypoint.sh
      - run: python -m unittest discover -s tests -v
      - name: Check source syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ['app', 'scripts', 'n8n', 'docker']:
              for path in Path(directory).rglob('*.py'):
                  ast.parse(path.read_text(), filename=str(path))
          PY
  arm64-one-command-install:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Install as a new user would
        run: |
          curl -fsSL https://raw.githubusercontent.com/leeseifer/pi-tts-pack/main/install.sh | bash -s -- --dir "$RUNNER_TEMP/pi-tts-pack" --https-port 0
      - name: Confirm boot service and zero personal clones
        run: |
          systemctl is-active pi-tts-pack
          curl -fsS http://127.0.0.1:5050/api/clones | python3 -c 'import json,sys; assert json.load(sys.stdin)["clones"] == []'
      - name: Collect service log
        if: always()
        run: sudo journalctl -u pi-tts-pack --no-pager -n 100
  arm64-docker-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, start, and test the ARM64 container
        run: bash docker-test.sh
      - name: Collect container logs
        if: always()
        run: docker compose logs --tail 100
      - name: Save test report and generated speech
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-audio-and-results
          path: docker-test-results/
      - name: Stop test container
        if: always()
        run: docker compose down
