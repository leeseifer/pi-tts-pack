<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Chat</title>
<style>
:root {
  --bg: #f4f5fa; --surface: #fff; --surface-2: #eef0f6; --border: #dfe2ec; --text: #161925; --muted: #6b7280;
  --accent: #5b5bd6; --accent-soft: #ebebfd; --me: #5b5bd6; --me-text: #fff; --danger: #e5484d;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1016; --surface: #171a23; --surface-2: #1f2330; --border: #2c3140; --text: #e9ebf2; --muted: #9aa3b5;
    --accent: #8b8bff; --accent-soft: #25254d; --me: #6d6dff; --me-text: #fff; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
header h1 { font-size: 17px; margin: 0; }
header .spacer { flex: 1; }
button { font: inherit; color: inherit; cursor: pointer; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
#settings { display: none; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 10px; flex-direction: column; }
#settings.open { display: flex; }
#settings label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
#settings select { font: inherit; font-size: 15px; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
#settings .row { display: flex; gap: 8px; flex-wrap: wrap; }
main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 320px; }
.empty b { color: var(--text); display: block; font-size: 18px; margin-bottom: 6px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 6px; }
.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
.bot audio { display: block; width: 100%; min-width: 220px; margin-top: 8px; height: 36px; }
.meta { font-size: 11.5px; opacity: .7; margin-top: 4px; }
.err { align-self: center; color: var(--danger); font-size: 14px; text-align: center; }
footer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
.langs { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; }
.langs button { border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.langs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.langs span { font-size: 12px; color: var(--muted); align-self: center; margin-right: 4px; }
#status { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
.bar { display: flex; align-items: center; gap: 10px; }
#text { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); outline: none; }
#send { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 50%; width: 44px; height: 44px; font-size: 18px; }
#mic { border: 0; width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 26px; flex: none; box-shadow: 0 4px 14px rgba(91,91,214,.35); transition: transform .1s; }
#mic:active { transform: scale(.96); }
#mic.rec { background: var(--danger); animation: pulse 1.1s ease-in-out infinite; }
#mic:disabled, #send:disabled { opacity: .5; cursor: not-allowed; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(229,72,77,.18); } }
</style>
</head>
<body>
<header>
  <span style="font-size:22px">🎙</span><h1>Voice Chat</h1><span class="spacer"></span>
  <button class="icon-btn" id="btnNew" title="New conversation">＋ New</button>
  <button class="icon-btn" id="btnSettings" title="Voices">⚙︎ Voices</button>
</header>
<div id="settings">
  <label>Reply voice for Vietnamese<select id="voiceVi"></select></label>
  <label>Reply voice for English<select id="voiceEn"></select></label>
  <div class="row"><button class="icon-btn" id="btnCode">🔑 Change access code</button></div>
</div>
<main id="chat">
  <div class="empty" id="empty"><b>Tap the mic and talk</b>Speak Vietnamese or English — the assistant answers out loud in the voice you choose under ⚙︎ Voices.</div>
</main>
<footer>
  <div class="langs" id="langs"><span>I speak</span>
    <button data-lang="vi">🇻🇳 Tiếng Việt</button><button data-lang="en">🇬🇧 English</button><button data-lang="auto">Auto</button>
  </div>
  <div id="status"></div>
  <div class="bar">
    <input id="text" placeholder="…or type a message" autocomplete="off">
    <button id="send" title="Send">➤</button>
    <button id="mic" title="Tap to talk, tap again to send">🎙</button>
  </div>
</footer>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
// Served by n8n itself (/webhook/voice-chat) or by the static page route (/voice) on the same domain.
const BASE = location.pathname.startsWith("/webhook") ? location.pathname.replace(/\/+$/, "") : "/webhook/voice-chat";
const store = {
  get(k, d) { try { const v = localStorage.getItem("vc." + k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("vc." + k, v); } catch {} },
};
let session = store.get("session", "") || newSession();
let busy = false, rec = null, chunks = [], stream = null, started = 0, timer = null;
let speakLang = store.get("lang", "vi");
function setLang(l) { speakLang = l; store.set("lang", l); document.querySelectorAll("#langs button").forEach((b) => b.classList.toggle("on", b.dataset.lang === l)); }

function newSession() { const s = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); store.set("session", s); return s; }
function status(t) { $("#status").textContent = t || ""; }
function add(cls, text, meta) {
  $("#empty")?.remove();
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; d.appendChild(m); }
  $("#chat").appendChild(d); d.scrollIntoView({ behavior: "smooth", block: "end" }); return d;
}
function setBusy(b) { busy = b; $("#send").disabled = b; $("#mic").disabled = b && !rec; }
function accessCode(force) {
  let c = store.get("code", "");
  if (!c || force) { c = (prompt("Access code for this voice chat:") || "").trim(); store.set("code", c); }
  return c;
}

async function loadVoices() {
  try {
    const r = await fetch(BASE + "/voices");
    const { voices } = await r.json();
    for (const [sel, lang, fallback] of [["#voiceVi", "vi", "vi_VN-vais1000-medium|"], ["#voiceEn", "en", "en_US-lessac-medium|"]]) {
      const groups = {};
      voices.filter((v) => v.lang === lang).forEach((v) => (groups[v.group] = groups[v.group] || []).push(v));
      const order = Object.keys(groups).sort((a, b) => (a.startsWith("My") ? -1 : b.startsWith("My") ? 1 : a.localeCompare(b)));
      $(sel).innerHTML = order.map((g) => `<optgroup label="${g}">${groups[g].map((v) => `<option value="${v.value}">${v.label}</option>`).join("")}</optgroup>`).join("");
      const saved = store.get(sel, fallback);
      $(sel).value = [...$(sel).options].some((o) => o.value === saved) ? saved : ($(sel).options[0]?.value || "");
    }
  } catch (e) { add("err", "Could not load voices: " + e.message); }
}

async function talk(form, shownText) {
  setBusy(true);
  form.append("session_id", session);
  form.append("voice_vi", $("#voiceVi").value);
  form.append("voice_en", $("#voiceEn").value);
  form.append("language", speakLang);
  if (shownText) add("me", shownText);
  const pending = shownText ? null : add("me", "🎙 …");
  status("Thinking…");
  try {
    let r = await fetch(BASE + "/talk", { method: "POST", headers: { "X-Access-Code": accessCode() }, body: form });
    if (r.status === 401) { accessCode(true); r = await fetch(BASE + "/talk", { method: "POST", headers: { "X-Access-Code": accessCode() }, body: form }); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || d.message || `HTTP ${r.status}`);
    if (pending) pending.firstChild.textContent = d.transcript || "(no speech heard)";
    const bot = add("bot", d.reply || "…", `${d.voice || ""}${d.speaker ? " · " + d.speaker : ""}`);
    if (d.audio) {
      const a = document.createElement("audio");
      a.controls = true; a.src = `data:${d.mime || "audio/mpeg"};base64,${d.audio}`;
      bot.insertBefore(a, bot.querySelector(".meta"));
      status("Speaking…"); a.onended = () => status("");
      a.play().catch(() => status("Tap ▶ to play"));
    } else status("");
  } catch (e) {
    if (pending) pending.remove();
    add("err", "⚠ " + e.message); status("");
  } finally { setBusy(false); }
}

async function toggleMic() {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (busy) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return add("err", "The microphone needs an https page.");
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { return add("err", "Microphone blocked: " + e.message); }
  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find((m) => MediaRecorder.isTypeSupported?.(m)) || "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    clearInterval(timer); stream.getTracks().forEach((t) => t.stop()); $("#mic").classList.remove("rec"); $("#mic").textContent = "🎙";
    const secs = (Date.now() - started) / 1000; const type = rec.mimeType || "audio/webm"; rec = null;
    if (secs < 0.6) return status("Too short — tap, speak, then tap again.");
    const f = new FormData();
    f.append("audio", new File([new Blob(chunks, { type })], "speech." + (type.includes("mp4") ? "m4a" : "webm"), { type }));
    talk(f);
  };
  rec.start(250); started = Date.now();
  $("#mic").classList.add("rec"); $("#mic").textContent = "■";
  timer = setInterval(() => { const s = (Date.now() - started) / 1000; status(`Listening… ${s.toFixed(0)}s — tap ■ to send`); if (s > 120) rec?.stop(); }, 250);
}

function sendText() {
  const t = $("#text").value.trim(); if (!t || busy) return;
  $("#text").value = ""; const f = new FormData(); f.append("text", t); talk(f, t);
}

$("#mic").onclick = toggleMic;
$("#send").onclick = sendText;
$("#text").addEventListener("keydown", (e) => { if (e.key === "Enter") sendText(); });
$("#btnSettings").onclick = () => $("#settings").classList.toggle("open");
$("#btnCode").onclick = () => accessCode(true);
$("#btnNew").onclick = () => { session = newSession(); $("#chat").innerHTML = '<div class="empty" id="empty"><b>New conversation</b>Tap the mic and talk.</div>'; status(""); };
["#voiceVi", "#voiceEn"].forEach((s) => ($(s).onchange = () => store.set(s, $(s).value)));
document.querySelectorAll("#langs button").forEach((b) => (b.onclick = () => setLang(b.dataset.lang)));
setLang(speakLang);
loadVoices();
</script>
</body>
</html>
